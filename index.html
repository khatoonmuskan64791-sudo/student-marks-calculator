<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marks Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <div class="icon" aria-hidden="true">🎓</div>
      <h1>Student Marks Calculator</h1>
      <p>Calculate total marks, percentage, and grade in seconds.</p>
    </header>

    <form id="marksForm">
      <label for="studentName">Student name</label>
      <input id="studentName" type="text" placeholder="Enter student name" required maxlength="60">

      <label for="subjectCount">Number of subjects</label>
      <select id="subjectCount">
        <option value="3">3 subjects</option>
        <option value="4">4 subjects</option>
        <option value="5" selected>5 subjects</option>
        <option value="6">6 subjects</option>
        <option value="7">7 subjects</option>
        <option value="8">8 subjects</option>
      </select>

      <div id="subjects" class="subjects"></div>
      <button type="submit">Calculate Results</button>
      <button type="button" id="resetButton" class="secondary">Reset</button>
    </form>

    <section id="result" class="result hidden" aria-live="polite">
      <h2>📊 Result Summary</h2>
      <p id="resultName"></p>
      <div class="stats">
        <div class="stat"><span>Total Marks</span><strong id="totalMarks">0</strong></div>
        <div class="stat"><span>Percentage</span><strong id="percentage">0%</strong></div>
        <div class="stat"><span>Grade</span><strong id="grade">-</strong></div>
      </div>
      <p id="status" class="status"></p>
      <p class="note">Assumption: each subject is out of 100; passing requires at least 35 marks in every subject.</p>
    </section>

    <footer>Student project • Built with HTML, CSS, and JavaScript</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
